<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Canvas grid points -->
  <circle cx="28" cy="28" r="1.5" fill="#475569" opacity="0.4"/>
  <circle cx="72" cy="28" r="1.5" fill="#475569" opacity="0.4"/>
  <circle cx="28" cy="72" r="1.5" fill="#475569" opacity="0.4"/>
  <circle cx="72" cy="72" r="1.5" fill="#475569" opacity="0.4"/>

  <!-- Connecting curves -->
  <path d="M 28 36 C 28 55, 72 45, 72 64" fill="none" stroke="url(#lc-grad)" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 28 36 C 50 36, 50 64, 72 64" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Left node -->
  <g filter="url(#glow)">
    <circle cx="28" cy="36" r="10" fill="#0F172A" stroke="url(#lc-grad)" stroke-width="3"/>
    <circle cx="28" cy="36" r="4.5" fill="#06B6D4"/>
  </g>

  <!-- Right node -->
  <g filter="url(#glow)">
    <circle cx="72" cy="64" r="10" fill="#0F172A" stroke="url(#lc-grad)" stroke-width="3"/>
    <circle cx="72" cy="64" r="4.5" fill="#8B5CF6"/>
  </g>

  <!-- Central link ring indicator -->
  <circle cx="50" cy="50" r="4" fill="#3B82F6" opacity="0.9"/>
</svg>

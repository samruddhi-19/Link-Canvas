<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Canvas — Horizontal Transition Preview</title>
    <link rel="stylesheet" href="/src/canvas/canvas.css" />
    <style>
      body {
        background: #090c10;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .demo-viewport {
        width: 100%;
        max-width: 1200px;
        height: 600px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body>
    <div id="root" class="demo-viewport"></div>
    <script type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";
      import CanvasApp from "/src/canvas/CanvasApp.jsx";

      ReactDOM.createRoot(document.getElementById("root")).render(
        React.createElement(CanvasApp, { t: null })
      );
    </script>
  </body>
</html>
